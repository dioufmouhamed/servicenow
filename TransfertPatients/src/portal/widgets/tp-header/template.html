<header class="tp-header">
  <div class="tp-wrap tp-header-in">
    <a class="tp-brand" href="?id=tp_accueil">
      <span class="tp-logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
      <span class="tp-brand-txt"><span class="tp-brand-t">Waluu</span><span class="tp-brand-s">Transferts de patients · Région de Dakar</span></span>
    </a>
    <nav class="tp-nav" aria-label="Navigation principale">
      <a ng-repeat="l in data.liens" href="{{::l.url}}" ng-class="{'actif': l.page == data.page}" aria-current="{{l.page == data.page ? 'page' : undefined}}">{{::l.label}}</a>
    </nav>
    <a class="tp-btn tp-btn-amber" ng-if="data.producteur" href="?id=sc_cat_item&sys_id={{::data.producteur}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      Nouvelle demande
    </a>
    <div class="dropdown">
      <button type="button" class="tp-avatar dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" aria-label="Compte : {{::data.utilisateur}}">{{::data.initiales}}</button>
      <ul class="dropdown-menu dropdown-menu-right">
        <li class="dropdown-header">{{::data.utilisateur}}</li>
        <li ng-repeat="e in data.etablissements" class="dropdown-header tp-etab">{{::e.nom}}</li>
        <li role="separator" class="divider"></li>
        <li><a href="/logout.do">Se déconnecter</a></li>
      </ul>
    </div>
  </div>
</header>
